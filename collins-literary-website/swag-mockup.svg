<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Playfair Display', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141210"/>
      <stop offset="100%" stop-color="#26221d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0c98d"/>
      <stop offset="55%" stop-color="#D9A35F"/>
      <stop offset="100%" stop-color="#C97A2B"/>
    </linearGradient>
    <linearGradient id="bookCover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f1c19"/>
      <stop offset="100%" stop-color="#0e0d0c"/>
    </linearGradient>
    <linearGradient id="spineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0908"/>
      <stop offset="100%" stop-color="#2a2521"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad)"/>
  <circle cx="980" cy="120" r="260" fill="#D9A35F" opacity="0.06"/>
  <circle cx="120" cy="700" r="220" fill="#C97A2B" opacity="0.06"/>

  <!-- Section label -->
  <text x="70" y="70" fill="#D9A35F" font-size="14" letter-spacing="4" font-family="Inter, sans-serif">AUTHOR BRANDING &amp; SWAG</text>
  <text x="70" y="98" fill="#8a8580" font-size="13" font-family="Inter, sans-serif">A consistent look across everything a reader touches</text>

  <!-- ===== Hardcover book ===== -->
  <g filter="url(#soft)">
    <rect x="120" y="150" width="34" height="480" fill="url(#spineGrad)"/>
    <rect x="154" y="150" width="330" height="480" rx="4" fill="url(#bookCover)" stroke="#3a342c" stroke-width="1"/>
    <rect x="154" y="150" width="330" height="480" rx="4" fill="none" stroke="#D9A35F" stroke-opacity="0.25" stroke-width="1" transform="translate(-6,-6)"/>
    <line x1="180" y1="230" x2="458" y2="230" stroke="#D9A35F" stroke-width="1.5" opacity="0.7"/>
    <text x="319" y="330" text-anchor="middle" fill="url(#gold)" font-size="46" font-weight="700" letter-spacing="2">8,2</text>
    <text x="319" y="378" text-anchor="middle" fill="url(#gold)" font-size="34" font-weight="700" letter-spacing="3">SECONDES</text>
    <text x="319" y="410" text-anchor="middle" fill="#c9c2b8" font-size="13" letter-spacing="5" font-family="Inter, sans-serif">ROMAN</text>
    <line x1="230" y1="470" x2="408" y2="470" stroke="#4a423a" stroke-width="1"/>
    <text x="319" y="560" text-anchor="middle" fill="#efe9df" font-size="24" letter-spacing="2" font-family="Inter, sans-serif" font-weight="400">MAXIME CHATTAM</text>
    <text x="319" y="600" text-anchor="middle" fill="#8a8580" font-size="12" letter-spacing="3" font-family="Inter, sans-serif">ALBIN MICHEL</text>
  </g>

  <!-- ===== Bookmark ===== -->
  <g filter="url(#soft)">
    <path d="M 560 150 H 640 V 610 L 600 575 L 560 610 Z" fill="#1c1a17" stroke="#3a342c"/>
    <path d="M 560 150 H 640 V 610 L 600 575 L 560 610 Z" fill="none" stroke="#D9A35F" stroke-opacity="0.35" stroke-width="1" transform="translate(4,4)"/>
    <text x="600" y="230" text-anchor="middle" fill="url(#gold)" font-size="17" font-weight="700" transform="rotate(90 600 230)" letter-spacing="2">8,2 SECONDES</text>
    <text x="600" y="400" text-anchor="middle" fill="#c9c2b8" font-size="11" font-family="Inter, sans-serif" letter-spacing="2" transform="rotate(90 600 400)">MAXIME CHATTAM</text>
    <line x1="600" y1="480" x2="600" y2="540" stroke="#4a423a" stroke-width="1"/>
    <text x="600" y="330" text-anchor="middle" fill="#D9A35F" font-size="10" font-family="Inter, sans-serif" letter-spacing="3" transform="rotate(90 600 330)">COLLINS LITERARY</text>
  </g>

  <!-- ===== Business / press card ===== -->
  <g filter="url(#soft)">
    <rect x="700" y="150" width="360" height="210" rx="10" fill="#1c1a17" stroke="#3a342c"/>
    <rect x="700" y="150" width="360" height="210" rx="10" fill="none" stroke="#D9A35F" stroke-opacity="0.3" stroke-width="1" transform="translate(5,5)"/>
    <text x="730" y="210" fill="url(#gold)" font-size="20" font-weight="700" letter-spacing="1">Maxime Chattam</text>
    <text x="730" y="234" fill="#8a8580" font-size="12" font-family="Inter, sans-serif" letter-spacing="1">Author — 8,2 Secondes</text>
    <line x1="730" y1="260" x2="1030" y2="260" stroke="#3a342c" stroke-width="1"/>
    <text x="730" y="290" fill="#c9c2b8" font-size="12" font-family="Inter, sans-serif">Represented for marketing by</text>
    <text x="730" y="316" fill="url(#gold)" font-size="16" font-weight="600" font-family="Inter, sans-serif" letter-spacing="1">Collins Literary</text>
    <text x="730" y="338" fill="#6f6a63" font-size="11" font-family="Inter, sans-serif">collinsLiterary@gmail.com</text>
  </g>

  <!-- ===== Lanyard / badge ===== -->
  <g filter="url(#soft)">
    <path d="M 850 400 Q 860 430 860 470 L 860 560" stroke="#2a2521" stroke-width="26" fill="none"/>
    <path d="M 850 400 Q 860 430 860 470 L 860 560" stroke="url(#gold)" stroke-width="2" fill="none" opacity="0.5"/>
    <text x="860" y="480" fill="#141210" font-size="10" font-family="Inter, sans-serif" letter-spacing="2" transform="rotate(90 860 480)">COLLINS LITERARY  •  COLLINS LITERARY</text>
    <rect x="800" y="560" width="120" height="150" rx="8" fill="#1c1a17" stroke="#3a342c"/>
    <circle cx="860" cy="560" r="10" fill="#0e0d0c" stroke="#3a342c"/>
    <text x="860" y="610" text-anchor="middle" fill="url(#gold)" font-size="12" font-weight="700" font-family="Inter, sans-serif">8,2</text>
    <text x="860" y="628" text-anchor="middle" fill="url(#gold)" font-size="10" font-weight="700" font-family="Inter, sans-serif" letter-spacing="1">SECONDES</text>
    <line x1="822" y1="645" x2="898" y2="645" stroke="#4a423a" stroke-width="1"/>
    <text x="860" y="670" text-anchor="middle" fill="#c9c2b8" font-size="8" font-family="Inter, sans-serif" letter-spacing="1">M. CHATTAM</text>
  </g>

  <!-- ===== Promo banner strip ===== -->
  <g filter="url(#soft)">
    <rect x="120" y="660" width="1000" height="90" rx="10" fill="#1c1a17" stroke="#3a342c"/>
    <rect x="120" y="660" width="6" height="90" fill="url(#gold)"/>
    <text x="160" y="698" fill="#efe9df" font-size="20" font-family="Inter, sans-serif" font-weight="500">8,2 SECONDES</text>
    <text x="160" y="722" fill="#8a8580" font-size="12" font-family="Inter, sans-serif">by Maxime Chattam — out now from Albin Michel</text>
    <text x="1080" y="712" text-anchor="end" fill="url(#gold)" font-size="13" font-family="Inter, sans-serif" letter-spacing="2">#OneLook</text>
  </g>
</svg>
